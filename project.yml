name: Todoloo
options:
  bundleIdPrefix: com.todoloo
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
schemes:
  Todoloo:
    build:
      targets:
        Todoloo: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - TodolooTests
targets:
  Todoloo:
    type: application
    platform: macOS
    sources:
      - path: Todoloo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoloo.app
        PRODUCT_NAME: Todoloo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Todoloo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Todoloo/Todoloo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    entitlements:
      path: Todoloo/Todoloo.entitlements
      properties:
        com.apple.security.app-sandbox: true

  TodolooTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TodolooTests
    dependencies:
      - target: Todoloo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoloo.tests
        GENERATE_INFOPLIST_FILE: YES
